<main class="section-page">
  <header>
    <h1>{{ title() }}</h1>
  </header>
  <p class="intro">This section is ready for Leo's artwork and project descriptions.</p>
  <div class="work-grid" aria-label="{{ title() }} projects">
    @for (item of placeholders; track item) {
      <div class="work-placeholder" role="img" [attr.aria-label]="title() + ' artwork placeholder ' + item">
        <span>Artwork placeholder</span>
      </div>
    }
  </div>
</main>
